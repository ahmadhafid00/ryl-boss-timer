<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYL2 XEROTH BOSS TRACKER</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 15px; }
        h1 { color: #ffcc00; font-size: 1.5rem; }
        .btn-noti { background: #00ccff; border: none; padding: 10px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
        .tab-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #333; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .tab-btn.active { background: #ffcc00; color: #000; }
        .container { max-width: 450px; margin: auto; background: #1e1e1e; padding: 10px; border-radius: 10px; }
        .boss-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        .boss-name { font-size: 1rem; font-weight: bold; text-align: left; flex: 1; }
        .timer { font-size: 1.1rem; font-family: monospace; width: 90px; font-weight: bold; }
        .color-ready { color: #00ff66; } 
        .color-countdown { color: #ff3333; } 
        .color-teleport { color: #ffcc00; } 
        .btn-reset { background: #ff3333; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h1>RYL2 XEROTH MAP 1 2 3 BOSS TRACKER</h1>
    <p>Masa: 14 Minit | Amaran suara baki 1 minit terakhir</p>
    
    <button class="btn-noti" onclick="mintaIzin()">🔔 AKTIFKAN NOTIFIKASI PC</button>
    
    <div class="tab-container">
        <button class="tab-btn active" id="t1" onclick="tukarMap(1)">MAP 1</button>
        <button class="tab-btn" id="t2" onclick="tukarMap(2)">MAP 2</button>
        <button class="tab-btn" id="t3" onclick="tukarMap(3)">MAP 3</button>
    </div>

    <div class="container" id="senaraiBox"></div>

    <script>
        // Bersihkan memori sangkut secara automatik
        if (!localStorage.getItem('bersih_v7')) {
            localStorage.clear();
            localStorage.setItem('bersih_v7', 'true');
        }

        const semuaBoss = {
            1: [
                { id: 101, name: "Ichzila" }, { id: 102, name: "Ancient town" },
                { id: 103, name: "Sirens" }, { id: 104, name: "Nzambi Mpungu" },
                { id: 105, name: "Guldan" }, { id: 106, name: "Brute" },
                { id: 107, name: "Elune" }, { id: 108, name: "Abomy" },
                { id: 109, name: "Ancient wood" }, { id: 110, name: "Death bringer" },
                { id: 111, name: "Smoldering death" }, { id: 112, name: "Fallen archfield" },
                { id: 113, name: "Hydra" }
            ],
            2: [
                { id: 201, name: "Tartarus" }, { id: 202, name: "Gorep King" },
                { id: 203, name: "Nianshou" }, { id: 204, name: "Death Bringer Mutant" },
                { id: 205, name: "Blackhand" }, { id: 206, name: "Marshall" },
                { id: 207, name: "Forsaken" }, { id: 208, name: "Headless" },
                { id: 209, name: "Anubarak" }, { id: 210, name: "Asmodeus" }
            ],
            3: [
                { id: 301, name: "Trollbane" }, { id: 302, name: "Agrono" },
                { id: 303, name: "Sephiroth" }, { id: 304, name: "Medusa" },
                { id: 305, name: "Ocelot Wendigo" }, { id: 306, name: "Sirens" },
                { id: 307, name: "Lamia" }, { id: 308, name: "Turkasaurus" },
                { id: 309, name: "Baphomet" }, { id: 310, name: "Underbog" },
                { id: 311, name: "Butcher" }
            ]
        };

        let mapSekarang = 1;
        const pemasaJalan = {};
        const bunyiDahAmaran = {};

        function mintaIzin() {
            if ("Notification" in window) {
                Notification.requestPermission().then(function(p) {
                    if (p === "granted") alert("Notifikasi PC Aktif!");
                });
            }
        }

        function tukarMap(nomborMap) {
            mapSekarang = nomborMap;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('t' + nomborMap).classList.add('active');
            paparSenarai();
        }

        function paparSenarai() {
            const box = document.getElementById('senaraiBox');
            const senaraiBossMap = semuaBoss[mapSekarang];

            const susunBoss = senaraiBossMap.slice().sort(function(a, b) {
                let mA = parseInt(localStorage.getItem('b_' + a.id)) || 0;
                let mB = parseInt(localStorage.getItem('b_' + b.id)) || 0;
                if (mA === 0 && mB === 0) return a.name.localeCompare(b.name);
                if (mA === 0) return 1;
                if (mB === 0) return -1;
                return mA - mB;
            });

            box.innerHTML = '';
            susunBoss.forEach(function(boss) {
                let baris = document.createElement('div');
                baris.className = 'boss-row';
                baris.innerHTML = '<div class="boss-name">' + boss.name + '</div><div class="timer color-ready" id="waktu_' + boss.id + '">READY</div><button class="btn-reset" id="btn_' + boss.id + '" onclick="mulaKira(' + boss.id + ')">DEAD</button>';
                box.appendChild(baris);
                
                let masaSimpan = localStorage.getItem('b_' + boss.id);
                if (masaSimpan) kiraUndur(boss.id, parseInt(masaSimpan), boss.name);
            });
        }

        function mulaKira(id) {
            const waktuTarget = new Date().getTime() + (14 * 60 * 1000);
            localStorage.setItem('b_' + id, waktuTarget);
            delete bunyiDahAmaran[id];
            paparSenarai();
        }

        function jeritSuara(nama) {
            if ('speechSynthesis' in window) {
                const s = new SpeechSynthesisUtterance('Warning. One minute left for ' + nama + '. Standby!');
                s.lang = 'en-US';
                window.speechSynthesis.speak(s);
            }
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("RYL2 WARNING!", { body: "Baki 1 minit untuk " + nama + "!" });
            }
        }

        function kiraUndur(id, target, nama) {
            if (pemasaJalan[id]) clearInterval(pemasaJalan[id]);

            function proses() {
                const jarak = target - new Date().getTime();
                const textMasa = document.getElementById('waktu_' + id);
                const tumpatButang = document.getElementById('btn_' + id);

                if (!textMasa) return;

                if (jarak < 0) {
                    clearInterval(pemasaJalan[id]);
                    textMasa.innerHTML = "TELEPORT!";
                    textMasa.className = "timer color-teleport";
                    if (tumpatButang) tumpatButang.innerText = "DEAD";
                    localStorage.removeItem('b_' + id);
                    delete bunyiDahAmaran[id];
                    paparSenarai();
                } else {
                    const min = Math.floor((jarak % 3600000) / 60000);
                    const saat = Math.floor((jarak % 60000) / 1000);
                    
                    let mStr = min < 10 ? '0' + min : min;
                    let sStr = saat < 10 ? '0' + saat : saat;
                    textMasa.innerHTML = mStr + ':' + sStr;
                    textMasa.className = "timer color-countdown";
                    if (tumpatButang) tumpatButang.innerText = "RESET";

                    if (min === 0 && !bunyiDahAmaran[id]) {
                        bunyiDahAmaran[id] = true;
                        jeritSuara(nama);
                    }
                }
            }
            proses();
            pemasaJalan[id] = setInterval(proses, 1000);
        }

        Object.keys(semuaBoss).forEach(function(mId) {
            semuaBoss[mId].forEach(function(b) {
                let s = localStorage.getItem('b_' + b.id);
                if (s) kiraUndur(b.id, parseInt(s), b.name);
            });
        });

        paparSenarai();
    </script>
</body>
</html>
