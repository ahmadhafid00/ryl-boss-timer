<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYL2 XEROTH BOSS TRACKER</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #000; 
            color: #fff; 
            text-align: center; 
            padding: 10px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #ffcc00; font-size: 1.4rem; margin: 5px 0; text-shadow: 0 0 8px rgba(255,204,0,0.5); }
        p { color: #aaa; font-size: 0.8rem; margin: 0 0 10px 0; }
        
        .btn-noti { 
            background: #00ccff; border: none; padding: 8px 12px; font-weight: bold; 
            border-radius: 4px; cursor: pointer; margin-bottom: 10px; color: #000;
        }
        
        .tab-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .tab-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .tab-btn.active { background: #990000; border-color: #ff3333; box-shadow: 0 0 8px #f00; }
        
        /* 🖼️ Bingkai Utama RYL Xeroth (Menggunakan pautan imej alternatif bebas sekatan) */
        .wrapper-xeroth {
            position: relative;
            width: 100%;
            max-width: 550px;
            height: 480px;
            background-image: url('https://weserv.nl');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center top;
            margin: auto;
        }

        /* 📦 Kotak Senarai Boss (Tepat di tengah-tengah ruang hitam bingkai) */
        .container { 
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -18%);
            width: 44%;
            height: 190px;
            overflow-y: auto;
        }
        .container::-webkit-scrollbar { width: 0px; }

        .boss-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 6px 2px; border-bottom: 1px solid rgba(255,204,0,0.2); 
        }
        .boss-row:last-child { border-bottom: none; }
        .boss-name { font-size: 0.8rem; font-weight: bold; text-align: left; flex: 1; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .timer { font-size: 0.9rem; font-family: monospace; width: 55px; font-weight: bold; text-align: center; }
        
        .color-ready { color: #00ff66; } 
        .color-countdown { color: #ff3333; } 
        .color-teleport { color: #ffcc00; } 
        
        .btn-reset { 
            background: #660000; color: #fff; border: 1px solid #990000; 
            padding: 3px 6px; border-radius: 3px; cursor: pointer; font-size: 0.7rem; font-weight: bold; 
        }
    </style>
</head>
<body>

    <h1>RYL2 XEROTH BOSS TRACKER</h1>
    <p>Masa: 14 Minit | Amaran suara baki 1 minit terakhir</p>
    
    <button class="btn-noti" onclick="mintaIzin()">🔔 AKTIFKAN NOTIFIKASI PC</button>
    
    <div class="tab-container">
        <button class="tab-btn active" id="t1" onclick="tukarMap(1)">MAP 1</button>
        <button class="tab-btn" id="t2" onclick="tukarMap(2)">MAP 2</button>
        <button class="tab-btn" id="tab3" onclick="tukarMap(3)">MAP 3</button>
    </div>

    <div class="wrapper-xeroth">
        <div class="container" id="senaraiBox"></div>
    </div>

    <script>
        if (!localStorage.getItem('clear_v11')) {
            localStorage.clear();
            localStorage.setItem('clear_v11', 'true');
        }

        const dataBoss = {
            1: [
                { id: 101, name: "Ichzila" }, { id: 102, name: "Ancient town" },
                { id: 103, name: "Sirens" }, { id: 104, name: "Nzambi Mpungu" },
                { id: 105, name: "Guldan" }, { id: 106, name: "Brute" },
                { id: 107, name: "Elune" }, { id: 108, name: "Abomy" },
                { id: 109, name: "Ancient wood" }, { id: 110, name: "Death bringer" },
                { id: 111, name: "Smoldering death" }, { id: 112, name: "Fallen archfield" },
                { id: 113, name: "Hydra" }
            ],
            2: [
                { id: 201, name: "Tartarus" }, { id: 202, name: "Gorep King" },
                { id: 203, name: "Nianshou" }, { id: 204, name: "Death Bringer Mutant" },
                { id: 205, name: "Blackhand" }, { id: 206, name: "Marshall" },
                { id: 207, name: "Forsaken" }, { id: 208, name: "Headless" },
                { id: 209, name: "Anubarak" }, { id: 210, name: "Asmodeus" }
            ],
            3: [
                { id: 301, name: "Trollbane" }, { id: 302, name: "Agrono" },
                { id: 303, name: "Sephiroth" }, { id: 304, name: "Medusa" },
                { id: 305, name: "Ocelot Wendigo" }, { id: 306, name: "Sirens" },
                { id: 307, name: "Lamia" }, { id: 308, name: "Turkasaurus" },
                { id: 309, name: "Baphomet" }, { id: 310, name: "Underbog" },
                { id: 311, name: "Butcher" }
            ]
        };

        let mapAktif = 1;
        const pemasa = {};
        const amaranSuara = {};

        function mintaIzin() {
            if ("Notification" in window) {
                Notification.requestPermission().then(function(p) {
                    if (p === "granted") alert("Notifikasi PC Aktif!");
                });
            }
        }

        function tukarMap(n) {
            mapAktif = n;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const bPilih = document.getElementById('t' + n) || document.getElementById('tab3');
            if (bPilih) bPilih.classList.add('active');
            papar();
        }

        function papar() {
            const box = document.getElementById('senaraiBox');
            const senarai = dataBoss[mapAktif];

            const susun = senarai.slice().sort(function(a, b) {
                let tA = parseInt(localStorage.getItem('b_' + a.id)) || 0;
                let tB = parseInt(localStorage.getItem('b_' + b.id)) || 0;
                if (tA === 0 && tB === 0) return a.name.localeCompare(b.name);
                if (tA === 0) return 1;
                if (tB === 0) return -1;
                return tA - tB;
            });

            box.innerHTML = '';
            susun.forEach(function(boss) {
                let div = document.createElement('div');
                div.className = 'boss-row';
                div.innerHTML = '<div class="boss-name">' + boss.name + '</div><div class="timer color-ready" id="w_' + boss.id + '">READY</div><button class="btn-reset" id="btn_' + boss.id + '" onclick="mula(' + boss.id + ')">DEAD</button>';
                box.appendChild(div);
                
                let s = localStorage.getItem('b_' + boss.id);
                if (s) jalan(boss.id, parseInt(s), boss.name);
            });
        }

        function mula(id) {
            const target = new Date().getTime() + (14 * 60 * 1000);
            localStorage.setItem('b_' + id, target);
            delete amaranSuara[id];
            papar();
        }

        function bunyi(nama) {
            if ('speechSynthesis' in window) {
                const ut = new SpeechSynthesisUtterance('Warning. One minute left for ' + nama + '. Standby!');
                ut.lang = 'en-US';
                window.speechSynthesis.speak(ut);
            }
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("RYL2 WARNING!", { body: "Baki 1 minit untuk " + nama + "!" });
            }
        }

        function jalan(id, target, nama) {
            if (pemasa[id]) clearInterval(pemasa[id]);

            function hitung() {
                const baki = target - new Date().getTime();
                const elMasa = document.getElementById('w_' + id);
                const elBtn = document.getElementById('btn_' + id);

                if (!elMasa) return;

                if (baki < 0) {
                    clearInterval(pemasa[id]);
                    elMasa.innerHTML = "TELEPORT!";
                    elMasa.className = "timer color-teleport";
                    if (elBtn) elBtn.innerText = "DEAD";
                    localStorage.removeItem('b_' + id);
                    delete amaranSuara[id];
                    papar();
                } else {
                    const m = Math.floor((baki % 3600000) / 60000);
                    const s = Math.floor((baki % 60000) / 1000);
                    
                    elMasa.innerHTML = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
                    elMasa.className = "timer color-countdown";
                    if (elBtn) elBtn.innerText = "RESET";

                    if (m === 0 && !amaranSuara[id]) {
                        amaranSuara[id] = true;
                        bunyi(nama);
                    }
                }
            }
            hitung();
            pemasa[id] = setInterval(hitung, 1000);
        }

        Object.keys(dataBoss).forEach(function(mId) {
            dataBoss[mId].forEach(function(b) {
                let s = localStorage.getItem('b_' + b.id);
                if (s) jalan(b.id, parseInt(s), b.name);
            });
        });

        papar();
    </script>
</body>
</html>
